[package]
name = "clone3-process"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt"], optional = true }

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[[example]]
name = "basic"
required-features = ["tokio"]

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
